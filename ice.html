<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Live Stream</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #00ff88; }
        p { color: #aaaaaa; margin-bottom: 1.5rem; font-size: 0.9rem; }
        
        /* Estilização do Player */
        audio {
            width: 100%;
            border-radius: 50px;
            outline: none;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            background-color: #2e2e2e;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 1rem;
            border: 1px solid #00ff88;
        }

        .pulsing-dot {
            height: 10px;
            width: 10px;
            background-color: #00ff88;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SDR Live</h1>
        <p>Streaming via Icecast (Oracle Cloud)</p>
        
        <audio controls autoplay>
            <source src="http://uk26freenew.listen2myradio.com:21922/stream2" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <div class="status-badge">
            <span class="pulsing-dot"></span> AO VIVO
        </div>
        
        <div style="margin-top: 20px; font-size: 10px; color: #555;">
            IP: 150.230.85.71 | Porta: 8000 /sdr
        </div>
    </div>

</body>
</html>
